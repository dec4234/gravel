plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Baritone has no Maven repository, so get the API jar from its GitHub release.
	ivy {
		name = "Baritone GitHub releases"
		url = "https://github.com/"
		patternLayout {
			artifact "[organisation]/[module]/releases/download/v[revision]/[module]-api-fabric-[revision].[ext]"
		}
		metadataSources { artifact() }
		content { includeModule("cabaletta", "baritone") }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gravel" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Used by the Gravel MCP server: `gradlew runClient -PquickPlayWorld=<world name>`
			// opens that singleplayer world directly after the game starts.
			def quickPlayWorld = providers.gradleProperty("quickPlayWorld")
			if (quickPlayWorld.isPresent() && !quickPlayWorld.get().isBlank()) {
				programArgs("--quickPlaySingleplayer", quickPlayWorld.get())
			}
			// `-Pmusic=true` lets the game play music. Gravel turns music off by default.
			def music = providers.gradleProperty("music")
			if (music.isPresent()) {
				property("gravel.music", music.get())
			}
		}
	}
}

// Client game tests: src/gametest. Run with `gradlew runClientGameTest`.
// This opens a real game window, joins a world and drives the mod through its HTTP bridge.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "gravel-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom {
	runs {
		clientGameTest {
			// Do not clash with a dev client (runClient) that already uses the default bridge port.
			property("gravel.bridge.port", "25598")
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Baritone (pathfinding) is optional at runtime: put the same jar in run/mods to use the path tools.
	// Gravel only compiles against its API and does not bundle it (Baritone is LGPL-3.0).
	clientCompileOnly "cabaletta:baritone:${project.baritone_version}"

	// Unit tests. fabric-loader-junit runs tests inside a Fabric Loader environment,
	// so Minecraft classes (and mixins) can load.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Let the tests see the client source set (the bridge code lives there).
sourceSets {
	test {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
