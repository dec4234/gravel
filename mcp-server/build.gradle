plugins {
	id 'java'
	id 'jacoco'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.code.gson:gson:2.13.1'

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// Coverage report: mcp-server/build/reports/jacoco/test/html/index.html
jacocoTestReport {
	dependsOn test
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Build one self-contained jar: mcp-server/build/libs/gravel-mcp.jar
jar {
	archiveFileName = 'gravel-mcp.jar'
	manifest {
		attributes 'Main-Class': 'net.dec4234.gravel.mcp.GravelMcpServer'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
}
